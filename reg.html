<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1 class="text-center bg-danger p-3 m-4">REGISTER</h1>

    <form action="">
        <fieldset bg line>
            <div class="row">
                <div class="form control">
                    <label for="">First Name</label>
                    <input type="text" placeholder="Enter First Name" class="form-control">
                </div>
                <div class="form control">
                    <label for="">Last Name</label>
                    <input type="text" placeholder="Enter Last Name" class="form-control">
                </div>
                <div class="form control">
                    <label for="">Email </label>
                    <input type="email" placeholder="Enter Email " class="form-control">
                </div>
                <div class="form control">
                    <label for="">Gender </label>
                    <input type="radio" name="gender"> Male     
                    <input type="radio" name="gender"> Female   
                    <input type="radio" name="gender"> Others
                </div>
                <div class="form control">
                    <label for="">Dob</label>
                    <input type="datetime-local" name="" id="" class="form-control">    
                </div>
                <div class="form control">
                    <label for="">Address</label>
                    <textarea name="" id="" placeholder="Enter Full address" class="form-control"></textarea>
                </div>
                <div class="form control">
                    <label for="">Resume</label>
                    <input type="file" class="form-control">
                </div>
                <div class="form control">
                    <label for="">Skills required</label>
                    <input type="checkbox" class="form-check-input">Python
                    <input type="checkbox" class="form-check-input">Java
                    <input type="checkbox" class="form-check-input">Web Technologies    
                    
                </div>
            </div>
            
        </fieldset>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
